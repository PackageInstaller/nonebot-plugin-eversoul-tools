# ========================================
# 永恒灵魂更新推送配置
# ========================================
# 
# 配置说明：
# - 每个类型下可以配置多个群号
# - 一个群可以同时配置在多个类型中
# - 推送优先级：具体类型(gl/cn) > all
#
# 支持的配置类型：
# ┌─────────────┬────────────────────────────────────┐
# │ 配置类型    │ 说明                               │
# ├─────────────┼────────────────────────────────────┤
# │ all         │ 接收所有服务器的更新推送           │
# │ gl          │ 接收国际服所有更新(Live + Review)  │
# │ cn          │ 接收国服所有更新(Live + Review)    │
# └─────────────┴────────────────────────────────────┘
#
# 配置示例：
# 1. 群A(123456)想接收所有更新 → 添加到 all
# 2. 群B(789012)只想接收国际服更新 → 添加到 gl
# 3. 群C(345678)只想接收国服更新 → 添加到 cn
# 4. 群D(901234)想接收国际服和国服更新 → 添加到 gl 和 cn（或直接添加到 all）
#
# ========================================

push_groups:
  # 接收所有服务器更新的群（国际服 + 国服）
  all:
    - 645741432
  
  # 接收国际服所有更新的群（Live + Review）
  gl: []
  
  # 接收国服所有更新的群（Live + Review）
  cn:
    - 1065478590
